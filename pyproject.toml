[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openfal"
version = "0.1.0"
description = "Strata-inspired 3-Tier Offload Inference Engine & fal.ai-Compatible Server for Wan 2.2 MoE, Qwen-Image-2.1 & MiniMax H3 (Video, Image, Omni-Ref & Face Swap) on Consumer GPUs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "openfal Contributors" }
]
keywords = [
    "wan2-2",
    "qwen-image",
    "minimax-h3",
    "fal-ai",
    "video-generation",
    "image-generation",
    "face-swap",
    "diffusion-transformer",
    "vram-offload",
    "strata",
    "consumer-gpu",
    "rtx-5060ti",
    "rtx-5090"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "httpx>=0.26.0",
    "safetensors>=0.4.2",
    "huggingface_hub>=0.23.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.4.0",
]
inference = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "diffusers>=0.43.0",
    "transformers>=5.23.0",
    "accelerate>=1.0.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
    "einops>=0.7.0",
    "av>=12.0.0",
    "imageio>=2.34.0",
    "imageio-ffmpeg>=0.5.1",
    "onnxruntime>=1.23.2",
    "opencv-python-headless>=4.10.0",
    "ftfy>=6.3.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.26.0",
]

[project.scripts]
openfal = "openfal.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openfal*"]

[tool.setuptools.package-data]
openfal = ["ui/*.html", "assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
